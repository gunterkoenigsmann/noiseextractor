<?xml version="1.0" encoding="UTF-8"?>
<!-- Icon of noiseextractor: a spectrogram in the program's colours. Blue
     bands are the remaining signal, the green frame a marked sound, red
     its overtones found by the analysis. Rendered to PNG/ICNS/ICO by the
     packaging scripts; noiseextractor.ico is generated by generate.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#101826"/>
  <g stroke-linecap="round" stroke-width="10" fill="none">
    <!-- Remaining signal (blue). -->
    <path d="M40 200 C 80 192, 110 208, 150 198 S 200 190, 216 196" stroke="#2f6fd6"/>
    <path d="M40 60 C 70 66, 100 54, 130 62" stroke="#2f6fd6" opacity="0.7"/>
    <!-- Overtones the analysis assigns to the marked sound (red). -->
    <path d="M70 118 C 100 104, 130 104, 160 118 S 200 132, 216 120" stroke="#e0412f"/>
    <path d="M70 84 C 100 66, 130 66, 160 84 S 200 102, 216 86" stroke="#e0412f" opacity="0.8"/>
    <!-- The marked fundamental (orange: marked and detected). -->
    <path d="M70 154 C 90 146, 104 144, 120 150" stroke="#f39a1e"/>
  </g>
  <!-- The user's selection (green). -->
  <rect x="56" y="132" width="76" height="40" rx="6" fill="none" stroke="#3ccf5a" stroke-width="7"/>
</svg>
