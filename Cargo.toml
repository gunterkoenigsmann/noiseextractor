[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]
# The GUI pulls in wxWidgets (built from source on first build) and cpal, so
# `cargo test` at the workspace root only builds the headless crates by
# default. Use `cargo build -p noiseextractor` to build the GUI.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gunterkoenigsmann/noiseextractor"

[workspace.dependencies]
noiseextractor-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# DSP code is painfully slow without optimisation; keep debug info but
# optimise our dependencies (FFT, decoders) even in debug builds.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
