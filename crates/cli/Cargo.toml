[package]
name = "noiseextractor-cli"
description = "Command-line front end of noiseextractor: run filter projects on audio files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "noiseextractor-cli"
path = "src/main.rs"

[dependencies]
noiseextractor-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"
