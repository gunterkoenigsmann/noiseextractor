[package]
name = "noiseextractor-core"
description = "Signal processing, filter model and background engine of noiseextractor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
realfft = "3.5"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
# Long recordings are decoded into mapped scratch files (src/samples.rs);
# normalized exports use a scratch file too (src/normalize.rs).
memmap2 = "0.9"
tempfile = "3"
bytemuck = "1"
# Export encoders (see src/export.rs). The C libraries (libvorbis, LAME,
# libopus) are compiled from bundled sources, so no system packages are
# needed on any platform.
flacenc = { version = "0.5", default-features = false }
vorbis_rs = { version = "0.5", default-features = false }
mp3lame-encoder = "0.3"
opus = "0.4"
ogg = "0.9"
rubato = "0.16"
alac-encoder = "0.3"

[dev-dependencies]
